name: U.S. Cargo Van Weather Alert Email

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  send-weather-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      PAGES_BASE_URL: https://superspeedlogisticsllc.github.io/super-speed-weather-monitor
      DEFER_EMAIL: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate report and separate detail page
        run: python weather_alert_email.py

      - name: Upload detailed alert page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish detailed alert page
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send email after detail page is published
        env:
          DEFER_EMAIL: "0"
        run: python weather_alert_email.py --send-pending
